thesis: >
  There exists a message-passing neural network architecture that can distinguish
  all pairs of non-isomorphic graphs that the 1-Weisfeiler-Leman graph
  isomorphism test can distinguish, using substantially fewer parameters and
  less compute than a standard graph convolutional network with mean aggregation.

null_hypothesis: >
  A standard 3-layer graph convolutional network with mean aggregation and
  linear update, trained on the same data with the same compute budget.

success_criteria:
  - "Achieves 100% classification accuracy on a curated set of 1-WL-distinguishable graph pairs that the baseline provably cannot separate"
  - "Maintains accuracy across graph sizes from 10 to 50 nodes without per-size tuning"
  - "Achieves higher accuracy per FLOP than the baseline across the full compute budget"

failure_criteria:
  - "Gradient norms exceed 50 for 3 consecutive checkpoints"
  - "Classification accuracy does not exceed 60% after consuming 50% of the compute budget"
  - "Loss does not decrease below initial loss after consuming 20% of the compute budget"

pre_registered_metrics:
  primary: classification_accuracy_wl_pairs
  secondary:
    - compute_to_threshold_ratio
    - samples_to_threshold_accuracy
    - gradient_health_mean_norm
    - param_efficiency_params_per_accuracy_point
    - distinguishability_coverage_fraction
  forbidden:
    - raw_loss_comparison_without_normalization
    - cherry_picked_graph_pair_accuracy

seeds: [42, 137, 256, 512, 1024]

training_budget:
  max_compute_flops: 1e14
  max_epochs: 5000
  max_wall_clock_minutes: 60

genome_constraints:
  max_node_count: 50
  max_parameters: 100000
  embedding_dim_range: [8, 128]

variance_tolerance: 0.10

references: []
